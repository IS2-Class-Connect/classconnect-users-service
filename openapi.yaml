openapi: 3.0.0
info:
  title: User API
  description: API to manage user data.
  version: 1.0.0

paths:
  /users:
    post:
      summary: Create a new user.
      description: Creates a new user with the provided details.
      operationId: createUser
      requestBody:
        description: User details to create a new user.
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: user@gmail.com
                name:
                  type: string
                  example: Username
                urlProfilePhoto:
                  type: string
                  format: uri
                  example: https://firebasestorage.googleapis.com/v0/profile_picture_user.jpg
                provider:
                  type: string
                  example: google.com
              required:
                - email
                - name
                - provider
      responses:
        '201':
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: Email already exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Email already exists"
                  error:
                    type: string
                    example: "Conflict"
                  statusCode:
                    type: integer
                    example: 409
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error"
                  error:
                    type: string
                    example: "Internal Server Error"
                  statusCode:
                    type: integer
                    example: 500

  /users/{user_id}/location:
    put:
      summary: Update user location.
      description: Updates the latitude and longitude for a user based on their ID.
      operationId: updateUserLocation
      parameters:
        - in: path
          name: id
          required: true
          description: ID of the user to update.
          schema:
            type: integer
            example: 1
      requestBody:
        description: Location data to update the user's location.
        content:
          application/json:
            schema:
              type: object
              properties:
                latitude:
                  type: number
                  format: float
                  example: 34.6037
                longitude:
                  type: number
                  format: float
                  example: 58.3816
              required:
                - latitude
                - longitude
      responses:
        '200':
          description: User location updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User not found"
                  error:
                    type: string
                    example: "Not Found"
                  statusCode:
                    type: integer
                    example: 404
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error"
                  error:
                    type: string
                    example: "Internal Server Error"
                  statusCode:
                    type: integer
                    example: 500

  /users/{id}/check-lock-status:
    get:
      summary: Check if a user's account is locked.
      description: Returns lock status of the user account.
      operationId: checkLockStatus
      parameters:
        - in: path
          name: id
          required: true
          description: ID of the user to check.
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Lock status retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Account is not locked
                  isLocked:
                    type: integer
                    description: 1 if locked, 0 if not, -1 if error
                    example: 0
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User not found
                  isLocked:
                    type: integer
                    example: -1
        '500':
          description: Error checking lock status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Error checking lock status
                  isLocked:
                    type: integer
                    example: -1

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: user@gmail.com
        name:
          type: string
          example: Username
        urlProfilePhoto:
          type: string
          format: uri
          example: https://firebasestorage.googleapis.com/v0/profile_picture_user.jpg
        provider:
          type: string
          example: google.com
        latitude:
          type: number
          format: float
          nullable: true
          example: 34.6037
        longitude:
          type: number
          format: float
          nullable: true
          example: 58.3816
        failedAttempts:
          type: integer
          example: 3
        accountLocked:
          type: boolean
          example: true
        lockUntil:
          type: string
          format: date-time
          nullable: true
          example: "2025-04-13T12:00:00Z"
        lastFailedAt:
          type: string
          format: date-time
          nullable: true
          example: "2025-04-12T14:00:00Z"