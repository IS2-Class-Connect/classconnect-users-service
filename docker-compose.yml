services:
  db_users:
    container_name: db_users
    image: postgres:15
    restart: always
    networks:
      - my-network
    ports:
      - 54321:54321
    environment:
      PGPORT: 54321
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: classconnect
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user", "-d", "classconnect"]
      interval: 10s
      retries: 10
      start_period: 20s
      timeout: 5s

  users:
    container_name: users
    build: .
    networks:
      - my-network
    ports:
      - 3001:3001
    environment:
      DATABASE_URL: postgresql://user:pass@db_users:54321/classconnect
      PORT: 3001
      JWT_SECRET: your_jwt_secret_here
    depends_on:
      db_users:
        condition: service_healthy

volumes:
  pgdata:

networks:
  my-network:
    name: classconnect_net
    external: true
