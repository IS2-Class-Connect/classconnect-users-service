services:
  app:
    container_name: classconnect_container
    restart: always
    env_file:
      - .env
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}
    networks:
      - shared

  db:
    image: postgres:15
    container_name: classconnect_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - shared

volumes:
  pgdata:

networks:
  shared: {}
